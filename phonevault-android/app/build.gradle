plugins { id 'com.android.application' }
android {
  namespace 'com.phonevault.mobile'
  compileSdk 35
  defaultConfig {
    applicationId 'com.phonevault.mobile'
    minSdk 29
    targetSdk 32
    versionCode 1
    versionName '0.1.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
