plugins { id 'com.android.application' }

android {
    namespace 'com.newswire.vehicleporttester'
    compileSdk 35
    defaultConfig {
        applicationId 'com.newswire.vehicleporttester.experiment.sync3'
        minSdk 26
        targetSdk 34
        versionCode 29
        versionName '0.9.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.smartdevicelink:sdl_android:5.8.0'
}
