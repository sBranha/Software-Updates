name: NewsWire v0.8.5 Windows EXE
on:
  push:
    branches:
      - newswire-storm-motion-v0.8.5
    paths:
      - 'newswire-command-center/**'
      - '.github/workflows/build-newswire-windows-v0.8.5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: newswire-command-center
        run: npm install --no-audit --no-fund
      - name: Prepare complete offline community data
        working-directory: newswire-command-center
        run: node prepare-cities.cjs
      - name: Syntax checks
        working-directory: newswire-command-center
        shell: bash
        run: |
          for src in main.cjs preload.cjs storm.js app.js main-radar-desk.js studio-ui.js storm-motion.js main-motion-ui.js auto-echo-ui.js site-radar.js radar-data/auto-echo.cjs radar-data/level2-volume.cjs; do
            node --check "$src"
          done
      - name: Run application tests
        working-directory: newswire-command-center
        run: npm test
      - name: Probe live KHTX radar observation metadata (informational)
        working-directory: newswire-command-center
        continue-on-error: true
        run: node radar-data/probe-live.cjs
      - name: Package Windows EXE
        working-directory: newswire-command-center
        run: npm run package:windows
      - name: Verify output and hash
        shell: pwsh
        run: |
          $files = @(Get-ChildItem newswire-command-center/dist/*.exe)
          if ($files.Count -eq 0) { throw 'No Windows EXE produced' }
          foreach ($file in $files) {
            if ($file.Length -lt 1MB) { throw "Installer too small: $($file.Name)" }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -Append -Encoding ascii newswire-command-center/dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWire-Command-Center-v0.8.5-Windows-EXE
          path: |
            newswire-command-center/dist/*.exe
            newswire-command-center/dist/SHA256SUMS.txt
          retention-days: 30
