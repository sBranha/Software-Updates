name: Publish Vehicle Explorer v0.9.8 direct APK download
on:
  push:
    branches:
      - vehicle-capability-explorer-v0.9.8-standalone-fordconnect
    paths:
      - '.github/workflows/publish-ford-explorer-v098.yml'
      - 'vehicle-usbc-diagnostic-tester/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-direct-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK if needed
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"; fi
      - name: Restore launcher JPEG
        run: |
          python3 -c 'from pathlib import Path; p=Path("vehicle-usbc-diagnostic-tester/app/src/main/res/drawable/vehicle_explorer_icon.jpg"); b=p.read_bytes(); assert len(b)==2528; p.write_bytes(b[:155]+bytes([118,118,118])+b[155:])'
      - name: Compile debug signed APK
        run: gradle -p vehicle-usbc-diagnostic-tester --no-daemon assembleDebug
      - name: Verify and stage direct APK
        run: |
          set -e
          APK="vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.newswire.vehicleporttester.experiment.sync3' versionCode='34' versionName='0.9.8'"
          mkdir -p release-assets
          cp "$APK" release-assets/Ford-Explorer-v0.9.8.apk
          cd release-assets && sha256sum Ford-Explorer-v0.9.8.apk > SHA256SUMS.txt
      - name: Publish direct public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="vehicle-explorer-v0.9.8-sync3-ford-data"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/Ford-Explorer-v0.9.8.apk release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" release-assets/Ford-Explorer-v0.9.8.apk release-assets/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease --title "Vehicle Explorer v0.9.8 - Standalone FordConnect API and SYNC 3 Cloud Vehicle Dashboard" \
              --notes "Debug-signed Android test APK for Standalone read-only FordConnect Query OAuth2 client with owner consent, on-device Android Keystore encryption of developer secrets/tokens, browser localhost redirect or manual fallback, authenticated telemetry, Ford SYNC 3 cloud status and refresh menus. Ford developer-issued app credentials and owner login required. No Ford app/widget dependency, no ECU controls or fabricated values."
          fi
      - name: Verify direct release asset exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vehicle-explorer-v0.9.8-sync3-ford-data --json assets --jq '.assets[].name' | grep -Fx 'Ford-Explorer-v0.9.8.apk'
