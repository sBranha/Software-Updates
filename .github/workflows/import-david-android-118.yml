name: Import David Android 1.1.8 UI Polish

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-david-android-118.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0578-81f5-babd-16254298df1c/raw?se=2026-09-25T16%3A08%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=efd6d79c-d6d6-5e44-99a4-687b914bcff0&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T12%3A40%3A28Z&ske=2026-09-26T12%3A40%3A28Z&sks=b&skv=2026-02-06&sig=B6SeHK58mCda5wJgafKvKXCEqCfg3pWLutvps4JezWU%3D' -o /tmp/david118.zip
          mkdir -p /tmp/david118
          unzip -o /tmp/david118.zip -d /tmp/david118
          test -f /tmp/david118/David-Android-1.1.8-UI-POLISH.apk
          echo '3ff0d17f3ac7d3bed8bda2bb6e00dfc8cf7af4b7b92ffc5873c0273b0a554419  /tmp/david118/David-Android-1.1.8-UI-POLISH.apk' | sha256sum -c -
      - name: Publish GitHub Android channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p david/android
          cp /tmp/david118/David-Android-1.1.8-UI-POLISH.apk david/android/David-Android-1.1.8.apk
          printf '%s  %s\n' '3ff0d17f3ac7d3bed8bda2bb6e00dfc8cf7af4b7b92ffc5873c0273b0a554419' 'David-Android-1.1.8.apk' > david/android/David-Android-1.1.8.sha256.txt
          cat > david/android/latest.json <<'JSON'
          {
            "version": "1.1.8",
            "publishedAt": "2026-09-25T16:02:55Z",
            "installerUrl": "https://raw.githubusercontent.com/sBranha/Software-Updates/main/david/android/David-Android-1.1.8.apk",
            "sha256": "3ff0d17f3ac7d3bed8bda2bb6e00dfc8cf7af4b7b92ffc5873c0273b0a554419",
            "notes": "David Android 1.1.8 polishes the App Updates screen: cleaner layout, installed/latest version cards, clearer security and download states, extra status-bar spacing, and the Download & Install button only appears when an update is actually available. Reminder, activation, sync, chat, caregiver PIN, licensing, and saved data are unchanged."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add david/android/David-Android-1.1.8.apk david/android/David-Android-1.1.8.sha256.txt david/android/latest.json
          git commit -m 'Publish David Android 1.1.8 UI polish'
          git push
