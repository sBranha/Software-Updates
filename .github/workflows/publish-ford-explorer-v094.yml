name: Publish Vehicle Explorer v0.9.4 direct APK download
on:
  push:
    branches:
      - vehicle-capability-explorer-v0.9.4-one-tap-audit
    paths:
      - '.github/workflows/publish-ford-explorer-v094.yml'
      - 'vehicle-usbc-diagnostic-tester/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-direct-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK if needed
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"; fi
      - name: Restore launcher JPEG
        run: |
          python3 -c 'from pathlib import Path; p=Path("vehicle-usbc-diagnostic-tester/app/src/main/res/drawable/vehicle_explorer_icon.jpg"); b=p.read_bytes(); assert len(b)==2528; p.write_bytes(b[:155]+bytes([118,118,118])+b[155:])'
      - name: Compile debug signed APK
        run: gradle -p vehicle-usbc-diagnostic-tester --no-daemon assembleDebug
      - name: Verify and stage direct APK
        run: |
          set -e
          APK="vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^package:'
          mkdir -p release-assets
          cp "$APK" release-assets/Ford-Explorer-v0.9.4.apk
          cd release-assets && sha256sum Ford-Explorer-v0.9.4.apk > SHA256SUMS.txt
      - name: Publish direct public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="vehicle-explorer-v0.9.4-sync3-ford-data"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/Ford-Explorer-v0.9.4.apk release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" release-assets/Ford-Explorer-v0.9.4.apk release-assets/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --prerelease --title "Vehicle Explorer v0.9.4 - SYNC 3 One-Tap Vehicle Audit" \
              --notes "Debug-signed Android test APK for One button on phone or Ford SYNC 3 to test 7 permitted Ford fields sequentially; status for Bluetooth, Ford cloud OAuth readiness and OBD-II availability; JSON results. OEM DISALLOWED may still occur. No vehicle controls, no simulated values."
          fi
      - name: Verify direct release asset exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vehicle-explorer-v0.9.4-sync3-ford-data --json assets --jq '.assets[].name' | grep -Fx 'Ford-Explorer-v0.9.4.apk'
