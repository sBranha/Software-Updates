name: Build Nikon Auto Upload APK

on:
  push:
    branches: [ nikon-auto-upload-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: nikon-auto-upload
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp nikon-auto-upload/app/build/outputs/apk/debug/app-debug.apk NikonAutoUpload-0.1.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikonAutoUpload-0.1.2-APK
          path: NikonAutoUpload-0.1.2.apk
          if-no-files-found: error
