name: Build Nikon Auto Upload APK

on:
  push:
    branches: [ nikon-auto-upload-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare source
        shell: bash
        run: |
          if ! grep -q '^import java.io.File;' nikon-auto-upload/app/src/main/java/com/nikonautoupload/MainActivity.java; then
            sed -i '/^import java.io.OutputStream;/i import java.io.File;' nikon-auto-upload/app/src/main/java/com/nikonautoupload/MainActivity.java
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nikon-auto-upload/app/src/main/java/com/nikonautoupload/MainActivity.java')
          s = p.read_text()
          s = s.replace('p.edit().remove("completed_upload_log").apply();', 'p.edit().remove("completed_upload_log").remove("event_log").apply();')
          s = s.replace('Button clear=big("CLEAR COMPLETED");clear.setOnClickListener(v->{p.edit().remove("completed_upload_log").remove("event_log").apply();drawUploads();});body.addView(clear);', 'Button clear=big("CLEAR COMPLETED & DIAGNOSTICS");clear.setOnClickListener(v->{p.edit().remove("completed_upload_log").remove("event_log").apply();toast("Upload history cleared");drawUploads();});body.addView(clear);')
          s = s.replace('Clear completed upload list when app closes', 'Clear completed & diagnostics when app closes')
          s = s.replace('Nikon Auto Upload 0.3.5', 'Nikon Auto Upload 0.3.6')
          s = s.replace('Version 0.3.5 adds game sessions, health checks, storage/battery status, cleanup and in-app deletion, favorites/share/filtering, duplicate protection, verified Flickr completion, pause controls and diagnostics.', 'Version 0.3.6 fixes Clear so completed uploads and Recent diagnostics clear together, including when the app closes if automatic clearing is enabled.')
          p.write_text(s)
          PY

      - name: Build unsigned release APK
        working-directory: nikon-auto-upload
        run: gradle --no-daemon clean assembleRelease

      - name: Package signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp nikon-auto-upload/app/build/outputs/apk/release/app-release-unsigned.apk NikonAutoUpload-0.3.6-unsigned.apk

      - name: Upload unsigned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: NikonAutoUpload-0.3.6-UNSIGNED
          path: |
            NikonAutoUpload-0.3.6-unsigned.apk
            signing-tools/
          if-no-files-found: error
