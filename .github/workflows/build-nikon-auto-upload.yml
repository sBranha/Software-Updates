name: Build Nikon Auto Upload APK

on:
  push:
    branches: [ nikon-auto-upload-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore migration-compatible 0.8.6 Java baseline
        shell: bash
        run: |
          for path in \
            nikon-auto-upload/app/src/main/java/com/nikonautoupload/SimpleFtpServer.java \
            nikon-auto-upload/app/src/main/java/com/nikonautoupload/DirectTransferService.java \
            nikon-auto-upload/app/src/main/java/com/nikonautoupload/MainActivity.java; do
            git show a04d2e4be121228462efd0c4b76c3d5c3e5eb484:"$path" > "$path"
          done

      - name: Prepare 0.8.6 baseline camera systems and photo-first editor
        shell: bash
        run: |
          mkdir -p nikon-auto-upload/app/src/main/res/drawable-nodpi
          base64 -d nikon-auto-upload/assets/z8_camera.webp.b64 > nikon-auto-upload/app/src/main/res/drawable-nodpi/z8_camera.webp
          base64 -d nikon-auto-upload/assets/launcher_z8.webp.b64 > nikon-auto-upload/app/src/main/res/drawable-nodpi/launcher_z8.webp
          python3 nikon-auto-upload/tools/patch_041.py
          python3 nikon-auto-upload/tools/patch_050.py
          python3 nikon-auto-upload/tools/patch_051.py
          python3 nikon-auto-upload/tools/patch_052.py
          python3 nikon-auto-upload/tools/patch_053.py
          python3 nikon-auto-upload/tools/patch_060.py
          python3 nikon-auto-upload/tools/patch_061.py
          python3 nikon-auto-upload/tools/patch_062.py
          python3 nikon-auto-upload/tools/patch_063.py
          python3 nikon-auto-upload/tools/patch_064.py
          python3 nikon-auto-upload/tools/patch_065.py
          python3 nikon-auto-upload/tools/patch_066.py
          python3 nikon-auto-upload/tools/patch_067.py
          python3 nikon-auto-upload/tools/patch_068.py
          python3 nikon-auto-upload/tools/patch_069.py
          python3 nikon-auto-upload/tools/patch_081.py
          python3 nikon-auto-upload/tools/patch_082.py
          python3 nikon-auto-upload/tools/patch_083.py
          python3 nikon-auto-upload/tools/patch_084.py
          python3 nikon-auto-upload/tools/patch_085.py
          python3 nikon-auto-upload/tools/prepare_patch_086.py
          python3 nikon-auto-upload/tools/prepare_patch_086_compile.py
          python3 nikon-auto-upload/tools/patch_086.py

      - name: Save baseline-post-migration Java for 0.8.7 integration
        uses: actions/upload-artifact@v4
        with:
          name: CameraAutoUpload-0.8.6-post-migration-sources
          path: |
            nikon-auto-upload/app/src/main/java/com/nikonautoupload/SimpleFtpServer.java
            nikon-auto-upload/app/src/main/java/com/nikonautoupload/DirectTransferService.java
            nikon-auto-upload/app/src/main/java/com/nikonautoupload/MainActivity.java

      - name: Apply 0.8.7 camera burst and screen awake fixes
        run: python3 nikon-auto-upload/tools/patch_087.py

      - name: Set 0.8.7 reliability-test version
        shell: bash
        run: |
          sed -i -e 's/versionCode 31/versionCode 32/' -e "s/versionName '0.8.6'/versionName '0.8.7'/" nikon-auto-upload/app/build.gradle
          grep -q 'versionCode 32' nikon-auto-upload/app/build.gradle
          grep -q "versionName '0.8.7'" nikon-auto-upload/app/build.gradle

      - name: Build unsigned release APK
        working-directory: nikon-auto-upload
        run: gradle --no-daemon clean assembleRelease

      - name: Package signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp nikon-auto-upload/app/build/outputs/apk/release/app-release-unsigned.apk CameraAutoUpload-0.8.7-unsigned.apk

      - name: Upload unsigned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: CameraAutoUpload-0.8.7-UNSIGNED
          path: |
            CameraAutoUpload-0.8.7-unsigned.apk
            signing-tools/
          if-no-files-found: error
