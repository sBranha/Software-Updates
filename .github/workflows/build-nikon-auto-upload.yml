name: Build Nikon Auto Upload APK

# 0.8.9+: the source in nikon-auto-upload/ is already fully prepared (all historical
# migrations from tools/ are applied and committed). Do NOT run tools/patch_*.py again.
on:
  push:
    branches: [ nikon-auto-upload-build, 'claude/nikon-*' ]
    paths:
      - 'nikon-auto-upload/**'
      - '.github/workflows/build-nikon-auto-upload.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore launcher and camera artwork
        shell: bash
        run: |
          mkdir -p nikon-auto-upload/app/src/main/res/drawable-nodpi
          base64 -d nikon-auto-upload/assets/z8_camera.webp.b64 > nikon-auto-upload/app/src/main/res/drawable-nodpi/z8_camera.webp
          base64 -d nikon-auto-upload/assets/launcher_z8.webp.b64 > nikon-auto-upload/app/src/main/res/drawable-nodpi/launcher_z8.webp

      - name: Read version
        id: ver
        shell: bash
        run: |
          name=$(grep -oP "versionName '\K[^']+" nikon-auto-upload/app/build.gradle)
          code=$(grep -oP "versionCode \K[0-9]+" nikon-auto-upload/app/build.gradle)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name (build $code)"

      - name: Build unsigned release APK
        working-directory: nikon-auto-upload
        run: gradle --no-daemon clean assembleRelease

      - name: Package APK and signing tools
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp nikon-auto-upload/app/build/outputs/apk/release/app-release-unsigned.apk "CameraAutoUpload-${{ steps.ver.outputs.name }}-unsigned.apk"

      - name: Upload unsigned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: CameraAutoUpload-${{ steps.ver.outputs.name }}-UNSIGNED
          path: |
            CameraAutoUpload-${{ steps.ver.outputs.name }}-unsigned.apk
            signing-tools/
          if-no-files-found: error
