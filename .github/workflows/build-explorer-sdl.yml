name: Build SYNC3 Vehicle Explorer 0.9.1
on:
  push:
    branches:
      - vehicle-capability-explorer-v0.9.2-screen-visibility
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-sdl-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore launcher JPEG
        run: |
          python3 -c 'from pathlib import Path; p=Path("vehicle-usbc-diagnostic-tester/app/src/main/res/drawable/vehicle_explorer_icon.jpg"); b=p.read_bytes(); assert len(b)==2528; p.write_bytes(b[:155]+bytes([118,118,118])+b[155:])'
      - name: Build
        run: gradle -p vehicle-usbc-diagnostic-tester --no-daemon --stacktrace assembleDebug
      - name: Check APK and signing
        run: |
          APK=vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Vehicle-Explorer-0.9.2-SYNC3-APK
          path: vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
