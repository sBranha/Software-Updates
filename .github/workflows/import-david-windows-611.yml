name: Import David Windows 6.1.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-david-windows-611.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Windows 6.1.1 build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0e74-81f5-9492-220d93a2692a/raw?se=2026-09-25T17%3A10%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=8efa04e8-b66c-5642-86a3-cd4802f4e224&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T13%3A04%3A28Z&ske=2026-09-26T13%3A04%3A28Z&sks=b&skv=2026-02-06&sig=5u4dqsdVD/j3Shi0i7jlpxWfGtILi6AEu4kMZeCLmww%3D' -o /tmp/david611.zip
          mkdir -p /tmp/david611
          unzip -o /tmp/david611.zip -d /tmp/david611
          test -f /tmp/david611/installer-output/David-6.1.1-Setup.exe
          echo '37332dc293a9766c0ef158745c5ffeb119ea0b6ff761acf76d9d7f7fe3695e7b  /tmp/david611/installer-output/David-6.1.1-Setup.exe' | sha256sum -c -

      - name: Publish Windows update channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p david/windows
          cp /tmp/david611/installer-output/David-6.1.1-Setup.exe david/windows/David-6.1.1-Setup.exe
          printf '%s  %s\n' '37332dc293a9766c0ef158745c5ffeb119ea0b6ff761acf76d9d7f7fe3695e7b' 'David-6.1.1-Setup.exe' > david/windows/David-6.1.1-Setup.sha256.txt
          cat > david/windows/latest.json <<'JSON'
          {
            "version": "6.1.1",
            "publishedAt": "2026-09-25T17:04:47Z",
            "installerUrl": "https://raw.githubusercontent.com/sBranha/Software-Updates/main/david/windows/David-6.1.1-Setup.exe",
            "sha256": "37332dc293a9766c0ef158745c5ffeb119ea0b6ff761acf76d9d7f7fe3695e7b",
            "notes": "David Windows 6.1.1 integrates shared cross-device reminder completion directly into David.exe, adds Android-compatible Every N Hours schedules with start and stop times, adds Movement / Activity and expanded reminder categories, preserves Connected Care and caregiver features, downloads future installers from the official GitHub update channel with SHA-256 verification, and retires the temporary DavidSharedSync helper during installation."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add david/windows/David-6.1.1-Setup.exe david/windows/David-6.1.1-Setup.sha256.txt david/windows/latest.json
          git commit -m 'Publish David Windows 6.1.1'
          git push
