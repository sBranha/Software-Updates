name: Import David Android 1.1.9 Hourly Reminders

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-david-android-119.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 1.1.9 build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-790c-81f5-bce1-daf7064d7fa9/raw?se=2026-09-25T16%3A30%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e24f8eac-dcd3-5aff-a666-abdaea902b26&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T13%3A23%3A05Z&ske=2026-09-26T13%3A23%3A05Z&sks=b&skv=2026-02-06&sig=IjbNuU9E%2BRK5bByBA/eVcxsXWNA4HRkyR7d6yxrQi9M%3D' -o /tmp/david119.zip
          mkdir -p /tmp/david119
          unzip -o /tmp/david119.zip -d /tmp/david119
          test -f /tmp/david119/David-Android-1.1.9-HOURLY-REMINDERS.apk
          echo '8d005ebec30054febcf0bc618132c9e7989f3cf4d95e435f491f31c428f87ec2  /tmp/david119/David-Android-1.1.9-HOURLY-REMINDERS.apk' | sha256sum -c -

      - name: Publish Android update channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p david/android
          cp /tmp/david119/David-Android-1.1.9-HOURLY-REMINDERS.apk david/android/David-Android-1.1.9.apk
          printf '%s  %s\n' '8d005ebec30054febcf0bc618132c9e7989f3cf4d95e435f491f31c428f87ec2' 'David-Android-1.1.9.apk' > david/android/David-Android-1.1.9.sha256.txt
          cat > david/android/latest.json <<'JSON'
          {
            "version": "1.1.9",
            "publishedAt": "2026-09-25T16:24:58Z",
            "installerUrl": "https://raw.githubusercontent.com/sBranha/Software-Updates/main/david/android/David-Android-1.1.9.apk",
            "sha256": "8d005ebec30054febcf0bc618132c9e7989f3cf4d95e435f491f31c428f87ec2",
            "notes": "David Android 1.1.9 makes the Add Reminder screen easy to read on the dark theme and adds hourly task schedules. Schedule and category selectors now use high-contrast text with clear labels. New choices include Every hour, Every 2, 3, 4, 6, 8, or 12 hours, with a start time and stop time so hourly reminders do not have to run overnight. It also adds Movement / Activity as a reminder type and shows a Medication Dose field when Medication is selected. Recurring reminders schedule their next normal occurrence when they fire. Existing activation, reminders, chat, sync, caregiver PIN, update system, licensing, and saved data are preserved."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add david/android/David-Android-1.1.9.apk david/android/David-Android-1.1.9.sha256.txt david/android/latest.json
          git commit -m 'Publish David Android 1.1.9 hourly reminders'
          git push
