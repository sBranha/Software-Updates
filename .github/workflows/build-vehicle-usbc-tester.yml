name: Build Vehicle USB-C Tester APK
on:
  push:
    branches:
      - vehicle-usbc-diagnostic-tester-v0.1.0
    paths:
      - 'vehicle-usbc-diagnostic-tester/**'
      - '.github/workflows/build-vehicle-usbc-tester.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug-signed APK
        run: gradle -p vehicle-usbc-diagnostic-tester --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vehicle-USB-C-Tester-v0.1.0-APK
          path: vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
