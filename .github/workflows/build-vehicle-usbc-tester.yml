name: Build Vehicle USB-C Tester APK
on:
  push:
    branches:
      - vehicle-usbc-diagnostic-tester-v0.2.0
    paths:
      - 'vehicle-usbc-diagnostic-tester/**'
      - '.github/workflows/build-vehicle-usbc-tester.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"; else echo 'SDK manager not found; use preinstalled platform'; fi
          ls -la "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug-signed APK
        run: gradle -p vehicle-usbc-diagnostic-tester --no-daemon --stacktrace assembleDebug
      - name: Verify APK signing and checksum
        run: |
          APK=vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vehicle-Port-Tester-v0.2.0-APK
          path: vehicle-usbc-diagnostic-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
