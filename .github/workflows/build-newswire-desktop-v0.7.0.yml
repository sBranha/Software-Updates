name: NewsWire v0.7.0 Windows and Mac installers
on:
  push:
    branches: [newswire-command-center-v0.7.0]
    paths:
      - 'newswire-command-center/**'
      - '.github/workflows/build-newswire-desktop-v0.7.0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            filetype: exe
          - os: macos-latest
            target: mac
            filetype: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared warning engine and desktop source
        shell: bash
        run: |
          node --test newswire-command-center/test.js
          node --check newswire-command-center/app.js
          node --check newswire-command-center/engine.js
          node --check newswire-command-center/main.cjs
      - name: Install desktop build dependencies
        working-directory: newswire-command-center
        run: npm install --no-audit --no-fund
      - name: Package installer
        working-directory: newswire-command-center
        run: npm run package:${{ matrix.target }}
      - name: Verify packaged output and compute SHA256
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const dir='newswire-command-center/dist',ext='.${{ matrix.filetype }}';
          const files=fs.readdirSync(dir).filter(f=>f.toLowerCase().endsWith(ext));
          if(!files.length)throw Error('No installer files were produced: '+ext);
          for(const f of files){
            const p=path.join(dir,f),data=fs.readFileSync(p),hash=crypto.createHash('sha256').update(data).digest('hex');
            if(data.length<1024*1024)throw Error('Suspiciously small installer: '+f);
            fs.appendFileSync(path.join(dir,'SHA256SUMS.txt'),hash+'  '+f+'\n');
            process.stdout.write(f+' '+data.length+' bytes SHA256 '+hash+'\n');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWire-0.7.0-${{ matrix.target }}-UNSIGNED-TEST
          path: |
            newswire-command-center/dist/*.${{ matrix.filetype }}
            newswire-command-center/dist/SHA256SUMS.txt
          retention-days: 15
