name: Publish NewsWire v0.7.12 signed Google Play AAB
on:
  push:
    branches: [newswire-direct-aab-download-v0.7.12]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify previously signed AAB
        shell: bash
        run: |
          set -euo pipefail
          cat newswire-downloads/v0.7.12/part-*.b64 | base64 --decode > NewsWire-v0.7.12-Google-Play-SIGNED.aab
          printf '%s  %s\n' '8cf49e532c0953b92868c8984bda82361fddf948c0fc040e0c6ce727d6564e91' 'NewsWire-v0.7.12-Google-Play-SIGNED.aab' | sha256sum -c -
          unzip -t NewsWire-v0.7.12-Google-Play-SIGNED.aab >/dev/null
          jarsigner -verify NewsWire-v0.7.12-Google-Play-SIGNED.aab | grep 'jar verified.'
          test "$(stat -c %s NewsWire-v0.7.12-Google-Play-SIGNED.aab)" -eq 3940399
      - name: Publish a one-click AAB asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='newswire-android-v0.7.12-download'
          asset='NewsWire-v0.7.12-Google-Play-SIGNED.aab'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title 'NewsWire Android v0.7.12 - Signed Google Play AAB' --notes 'Signed Google Play upload bundle for NewsWire Android v0.7.12 (versionCode 47). Contains Google Maps-style close 3D driving view. This is a Google Play AAB, not a directly installable APK.'
          fi
