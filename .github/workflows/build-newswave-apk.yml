name: NewsWave Android APK
on:
  push:
    branches: [newswave-android-v0-1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle -p newswave-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWave-Live-v0.1.0-APK
          path: newswave-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
