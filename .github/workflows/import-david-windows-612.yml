name: Import David Windows 6.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-david-windows-612.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified 6.1.2 build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1e00-81f5-a2da-cd69df5c96e1/raw?se=2026-09-26T00%3A31%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=af1438df-dfe5-5e37-bbb0-baacd32b6e38&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A51%3A23Z&ske=2026-09-26T19%3A51%3A23Z&sks=b&skv=2026-02-06&sig=BUu%2BFM173u7uDamyLKOvuIBQ7rqHf4jxQ2juEb6iMM8%3D' -o /tmp/david-windows-612.zip
          mkdir -p /tmp/david-windows-612
          unzip -o /tmp/david-windows-612.zip -d /tmp/david-windows-612
          test -f /tmp/david-windows-612/David-6.1.2-Setup.exe
          echo '6cebd6ecd4b36fab7b23d40a798637fde556557051e60f76ec5f7b5c899bde2f  /tmp/david-windows-612/David-6.1.2-Setup.exe' | sha256sum -c -

      - name: Publish Windows update channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p david/windows
          cp /tmp/david-windows-612/David-6.1.2-Setup.exe david/windows/David-6.1.2-Setup.exe
          printf '%s  %s\n' '6cebd6ecd4b36fab7b23d40a798637fde556557051e60f76ec5f7b5c899bde2f' 'David-6.1.2-Setup.exe' > david/windows/David-6.1.2-Setup.sha256.txt
          cat > david/windows/latest.json <<'JSON'
          {
            "version": "6.1.2",
            "publishedAt": "2026-09-26T00:26:23Z",
            "installerUrl": "https://raw.githubusercontent.com/sBranha/Software-Updates/main/david/windows/David-6.1.2-Setup.exe",
            "sha256": "6cebd6ecd4b36fab7b23d40a798637fde556557051e60f76ec5f7b5c899bde2f",
            "notes": "David Windows 6.1.2 changes licensing to a reusable person-level license key with separate 6-digit device pairing. The same license key can be used on multiple David devices, each device pairs separately to the person/caregiver account, updates preserve local David data, and the existing cross-device reminder sync, hourly reminders, caregiver tools, chat, and GitHub updater remain in place."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add david/windows/David-6.1.2-Setup.exe david/windows/David-6.1.2-Setup.sha256.txt david/windows/latest.json
          git commit -m 'Publish David Windows 6.1.2 license and device pairing'
          git push
