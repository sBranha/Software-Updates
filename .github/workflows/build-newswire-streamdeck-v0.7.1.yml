name: NewsWire v0.8.0 WINDOWS ONLY - Independent Fullscreen Storm Desks
on:
  push:
    branches: [newswire-independent-storm-desks-v0.8.0]
    paths:
      - 'newswire-command-center/**'
      - '.github/workflows/build-newswire-streamdeck-v0.7.1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-and-build:
    name: Test and package Windows ONLY
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare verified offline Census-based place database
        shell: bash
        run: node newswire-command-center/prepare-cities.cjs
      - name: Verify bundled national city data
        shell: bash
        run: |
          node -e "const d=require('./newswire-command-center/data/census-places-2025.json');if(d.length<17500||!d.some(x=>x.name==='Guntersville'&&x.state==='AL'))process.exit(1);console.log(d.length+' offline cities ready')"
      - name: Test polygon services and desktop modules
        shell: bash
        run: |
          node --test newswire-command-center/test.js newswire-command-center/deck-bridge.test.cjs newswire-command-center/window-layout.test.cjs newswire-command-center/radar-tracking.test.cjs newswire-command-center/draw-loop.test.cjs newswire-command-center/communities-service.test.cjs newswire-command-center/offline-cities.test.cjs newswire-command-center/polygon-focus.test.cjs newswire-command-center/studio-map.test.cjs newswire-command-center/independent-desks.test.cjs newswire-command-center/storm-desks-runtime.test.cjs
          node --check newswire-command-center/main.cjs
          node --check newswire-command-center/preload.cjs
          node --check newswire-command-center/polygon-ui.js
          node --check newswire-command-center/communities-service.cjs
          node --check newswire-command-center/drawn-tracks.js
          node --check newswire-command-center/offline-cities.cjs
          node --check newswire-command-center/prepare-cities.cjs
          node --check newswire-command-center/map-views.js
          node --check newswire-command-center/storm.js
          node --check newswire-command-center/app.js
          node --check newswire-command-center/polygon-ui.js
      - name: Install desktop dependencies
        working-directory: newswire-command-center
        run: npm install --no-audit --no-fund
      - name: Package Windows x64 installer only
        working-directory: newswire-command-center
        run: npm run package:windows
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.8.0-Windows-only
          path: newswire-command-center/dist/NewsWire-Command-Center-0.8.0-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
  release-windows:
    name: Publish tested WINDOWS ONLY preview
    needs: windows-test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: newswire-v080-win-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NewsWire-v0.8.0-Windows-only
          path: release-assets
      - name: Publish Windows installer (no Mac build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="newswire-v0.8.0-windows-preview"
          FILE="release-assets/NewsWire-Command-Center-0.8.0-Windows-Setup.exe"
          test -s "$FILE"
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/newswire-independent-storm-desks-v0.8.0" --jq '.object.sha')
          test "$GITHUB_SHA" = "$LATEST" || { echo "Superseded by a newer build; skipping publish"; exit 0; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'NewsWire v0.8.0 - WINDOWS ONLY - Four Independent Storm Desks' \
              --notes 'Windows-only v0.8.0 preview. Four individually configurable detachable storm windows. Each independently stores zoom and location, satellite/street/terrain map mode, radar on/off, radar animation, NWS warning overlay, auto-focus, radar-only presentation mode, and personal storm polygon with offline Census community lookup. Each storm pane has Full Screen button and stays draggable to different physical monitors. Other panels are unaffected by changes to an individual storm pane. Still displays IEM NEXRAD composite reflectivity only: direct single-site KHTX velocity and dual-polarization/3D are NOT yet implemented. Drawn shapes are not official storm forecasts. Google Maps and Street View are external links. Automated tests and Windows packaging pass, but real multimonitor/UI and live feeds remain unverified until tested on hardware. Windows installer is unsigned; Mac paused, Android unchanged.'
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$FILE" --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt*3))
          done
          sha256sum "$FILE"
