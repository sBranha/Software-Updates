name: NewsWire v0.7.6 WINDOWS ONLY - Polygon Communities Lookup Fix
on:
  push:
    branches: [newswire-windows-community-lookup-v0.7.6]
    paths:
      - 'newswire-command-center/**'
      - '.github/workflows/build-newswire-streamdeck-v0.7.1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-and-build:
    name: Test and package Windows ONLY
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test polygon services and desktop modules
        shell: bash
        run: |
          node --test newswire-command-center/test.js newswire-command-center/deck-bridge.test.cjs newswire-command-center/window-layout.test.cjs newswire-command-center/radar-tracking.test.cjs newswire-command-center/draw-loop.test.cjs newswire-command-center/communities-service.test.cjs
          node --check newswire-command-center/main.cjs
          node --check newswire-command-center/preload.cjs
          node --check newswire-command-center/polygon-ui.js
          node --check newswire-command-center/communities-service.cjs
          node --check newswire-command-center/drawn-tracks.js
      - name: Install desktop dependencies
        working-directory: newswire-command-center
        run: npm install --no-audit --no-fund
      - name: Package Windows x64 installer only
        working-directory: newswire-command-center
        run: npm run package:windows
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.7.6-Windows-only
          path: newswire-command-center/dist/NewsWire-Command-Center-0.7.6-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
  release-windows:
    name: Publish tested WINDOWS ONLY preview
    needs: windows-test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: newswire-v076-win-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NewsWire-v0.7.6-Windows-only
          path: release-assets
      - name: Publish Windows installer (no Mac build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="newswire-v0.7.6-windows-preview"
          FILE="release-assets/NewsWire-Command-Center-0.7.6-Windows-Setup.exe"
          test -s "$FILE"
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/newswire-windows-community-lookup-v0.7.6" --jq '.object.sha')
          test "$GITHUB_SHA" = "$LATEST" || { echo "Superseded by a newer build; skipping publish"; exit 0; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'NewsWire v0.7.6 - Windows ONLY - Community Polygon Lookup Repair' \
              --notes 'Windows-only preview. Fixes drawn-polygon community lookup by making Overpass calls in the Electron main process rather than restricted file-origin JavaScript. Displays status near the top of the tracker and places as blue dots on the radar map; adds Retry Communities and clear error states. Free OpenStreetMap names are approximate and can be incomplete, and the source may be unreachable. Polygon is user-drawn, not an official warning or storm-arrival forecast. Automated source tests passed, but real API responses and the physical Windows UI have not been verified. UNSIGNED installer. Mac is on hold at user request; signed Android Play version unchanged.'
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$FILE" --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt*3))
          done
          sha256sum "$FILE"
