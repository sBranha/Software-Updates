name: NewsWire v0.8.0 WINDOWS ONLY - Independent Radar Site Products per Screen
on:
  push:
    branches: [newswire-independent-khtx-radar-v0.8.0]
    paths:
      - 'newswire-command-center/**'
      - '.github/workflows/build-newswire-streamdeck-v0.7.1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-and-build:
    name: Test and package Windows ONLY
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare verified offline Census-based place database
        shell: bash
        run: node newswire-command-center/prepare-cities.cjs
      - name: Verify bundled national city data
        shell: bash
        run: |
          node -e "const d=require('./newswire-command-center/data/census-places-2025.json');if(d.length<17500||!d.some(x=>x.name==='Guntersville'&&x.state==='AL'))process.exit(1);console.log(d.length+' offline cities ready')"
      - name: Test polygon services and desktop modules
        shell: bash
        run: |
          node --test newswire-command-center/test.js newswire-command-center/deck-bridge.test.cjs newswire-command-center/window-layout.test.cjs newswire-command-center/radar-tracking.test.cjs newswire-command-center/draw-loop.test.cjs newswire-command-center/communities-service.test.cjs newswire-command-center/offline-cities.test.cjs newswire-command-center/polygon-focus.test.cjs newswire-command-center/studio-map.test.cjs newswire-command-center/site-radar.test.cjs
          node --check newswire-command-center/main.cjs
          node --check newswire-command-center/preload.cjs
          node --check newswire-command-center/polygon-ui.js
          node --check newswire-command-center/communities-service.cjs
          node --check newswire-command-center/drawn-tracks.js
          node --check newswire-command-center/offline-cities.cjs
          node --check newswire-command-center/prepare-cities.cjs
          node --check newswire-command-center/map-views.js
          node --check newswire-command-center/storm.js
          node --check newswire-command-center/site-radar.js
          node --check newswire-command-center/app.js
          node --check newswire-command-center/polygon-ui.js
      - name: Install desktop dependencies
        working-directory: newswire-command-center
        run: npm install --no-audit --no-fund
      - name: Package Windows x64 installer only
        working-directory: newswire-command-center
        run: npm run package:windows
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.8.0-Windows-only
          path: newswire-command-center/dist/NewsWire-Command-Center-0.8.0-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
  release-windows:
    name: Publish tested WINDOWS ONLY preview
    needs: windows-test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: newswire-v080-win-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NewsWire-v0.8.0-Windows-only
          path: release-assets
      - name: Publish Windows installer (no Mac build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="newswire-v0.8.0-windows-preview"
          FILE="release-assets/NewsWire-Command-Center-0.8.0-Windows-Setup.exe"
          test -s "$FILE"
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/newswire-independent-khtx-radar-v0.8.0" --jq '.object.sha')
          test "$GITHUB_SHA" = "$LATEST" || { echo "Superseded by a newer build; skipping publish"; exit 0; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'NewsWire 0.8.0 — WINDOWS ONLY — Independent KHTX Doppler Radar Desk' \
              --notes 'NewsWire v0.8.0 Windows-only development preview. Four independent radar tracking windows can choose a saved NEXRAD radar site and Level III product separately. Initial stations: KHTX (Hytop AL), KOHX (Nashville), KFFC (Peachtree City), KMRX (Morristown). Supported IEM RIDGE WMS products: N0B base reflectivity, N0U base radial velocity, N0S storm-relative velocity. Click site markers or use each window selector. National mosaic animation remains an alternative mode; single-site RIDGE is latest still image only, no verified scan timestamp or historical loop. User-drawn polygons are saved per tracker and no longer erased on NWS warning reassignment. Monitor-specific map mode and viewport persist. Radar backend relies on Iowa Environmental Mesonet source uptime; real image delivery has not been verified in a physical Windows session. Not Level II analysis, 3D radar, or automatic rotation detection. No paid tiers, no user subscription; Windows unsigned installer. Mac builds paused, Android Play unchanged. Keep official NWS warnings and Wireless Emergency Alerts on.'
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$FILE" --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt*3))
          done
          sha256sum "$FILE"
