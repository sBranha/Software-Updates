name: NewsWire v0.7.7 WINDOWS ONLY - Polygon Communities Lookup Fix
on:
  push:
    branches: [newswire-offline-communities-v0.7.7]
    paths:
      - 'newswire-command-center/**'
      - '.github/workflows/build-newswire-streamdeck-v0.7.1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test-and-build:
    name: Test and package Windows ONLY
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare verified offline Census-based place database
        shell: bash
        run: node newswire-command-center/prepare-cities.cjs
      - name: Verify bundled national city data
        shell: bash
        run: |
          node -e "const d=require('./newswire-command-center/data/census-places-2025.json');if(d.length<17500||!d.some(x=>x.name==='Guntersville'&&x.state==='AL'))process.exit(1);console.log(d.length+' offline cities ready')"
      - name: Test polygon services and desktop modules
        shell: bash
        run: |
          node --test newswire-command-center/test.js newswire-command-center/deck-bridge.test.cjs newswire-command-center/window-layout.test.cjs newswire-command-center/radar-tracking.test.cjs newswire-command-center/draw-loop.test.cjs newswire-command-center/communities-service.test.cjs newswire-command-center/offline-cities.test.cjs
          node --check newswire-command-center/main.cjs
          node --check newswire-command-center/preload.cjs
          node --check newswire-command-center/polygon-ui.js
          node --check newswire-command-center/communities-service.cjs
          node --check newswire-command-center/drawn-tracks.js
          node --check newswire-command-center/offline-cities.cjs
          node --check newswire-command-center/prepare-cities.cjs
      - name: Install desktop dependencies
        working-directory: newswire-command-center
        run: npm install --no-audit --no-fund
      - name: Package Windows x64 installer only
        working-directory: newswire-command-center
        run: npm run package:windows
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.7.7-Windows-only
          path: newswire-command-center/dist/NewsWire-Command-Center-0.7.6-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30
  release-windows:
    name: Publish tested WINDOWS ONLY preview
    needs: windows-test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: newswire-v077-win-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NewsWire-v0.7.7-Windows-only
          path: release-assets
      - name: Publish Windows installer (no Mac build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="newswire-v0.7.7-windows-preview"
          FILE="release-assets/NewsWire-Command-Center-0.7.6-Windows-Setup.exe"
          test -s "$FILE"
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/newswire-offline-communities-v0.7.7" --jq '.object.sha')
          test "$GITHUB_SHA" = "$LATEST" || { echo "Superseded by a newer build; skipping publish"; exit 0; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'NewsWire v0.7.7 - Windows ONLY - Community Polygon Lookup Repair' \
              --notes 'Windows-only v0.7.7 preview. Includes a built-in checksum-verified 2025 U.S. Census-based nationwide city-center dataset. Drawn polygons show towns whose representative centers fall inside the area even with NO network or Overpass servers. Nearby towns outside the polygon are labeled OUTSIDE and NOT assumed affected. More Communities (Online) optionally augments with OSM names but cannot erase offline results on HTTP 406 or DNS failure. Four radar tracker windows and animated radar maintained. Automated tests and Windows packaging passed; real interactive UI and live service behavior require on-machine validation. UNSIGNED installer. Mac development on hold; signed Android Play version unchanged.'
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$FILE" --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt*3))
          done
          sha256sum "$FILE"
