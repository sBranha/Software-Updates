name: Import David Android 1.1.10

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-david-android-1110.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download verified Android 1.1.10 build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8ac0-81f5-be39-0795497ebd27/raw?se=2026-09-26T00%3A55%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=fe1c88f6-3b70-54bf-89c8-6532b0014403&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A51%3A23Z&ske=2026-09-26T19%3A51%3A23Z&sks=b&skv=2026-02-06&sig=WPuzRBtFV0xArmqd5wRDGW5IF7xDxBV1/p6LjawDz2c%3D' -o /tmp/david-android-1110.zip
          mkdir -p /tmp/david-android-1110
          unzip -o /tmp/david-android-1110.zip -d /tmp/david-android-1110
          test -f /tmp/david-android-1110/David-Android-1.1.10-SHARED-DONE-CLEAR.apk
          echo '35b0826f7cdfc56620594f35a0fba0f13f6f94fbdf83aec9352755fcf33add3f  /tmp/david-android-1110/David-Android-1.1.10-SHARED-DONE-CLEAR.apk' | sha256sum -c -
      - name: Publish Android update channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p david/android
          cp /tmp/david-android-1110/David-Android-1.1.10-SHARED-DONE-CLEAR.apk david/android/David-Android-1.1.10.apk
          printf '%s  %s\n' '35b0826f7cdfc56620594f35a0fba0f13f6f94fbdf83aec9352755fcf33add3f' 'David-Android-1.1.10.apk' > david/android/David-Android-1.1.10.sha256.txt
          cat > david/android/latest.json <<'JSON'
          {
            "version": "1.1.10",
            "publishedAt": "2026-09-26T00:49:58Z",
            "installerUrl": "https://raw.githubusercontent.com/sBranha/Software-Updates/main/david/android/David-Android-1.1.10.apk",
            "sha256": "35b0826f7cdfc56620594f35a0fba0f13f6f94fbdf83aec9352755fcf33add3f",
            "notes": "David Android 1.1.10 adds live shared reminder completion. If Windows or another paired David device marks the exact open occurrence DONE, the Android reminder syncs the shared state and closes automatically. Phone DONE continues syncing to Windows. Existing hourly reminders, polished updater, activation, pairing, chat, and data remain in place."
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add david/android/David-Android-1.1.10.apk david/android/David-Android-1.1.10.sha256.txt david/android/latest.json
          git commit -m 'Publish David Android 1.1.10 shared DONE clear'
          git push
