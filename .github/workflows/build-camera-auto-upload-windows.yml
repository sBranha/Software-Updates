name: Build Camera Auto Upload Windows

on:
  workflow_dispatch:
  push:
    branches: [ nikon-auto-upload-build, 'claude/nikon-*' ]
    paths:
      - 'camera-auto-upload-windows/**'
      - 'nikon-auto-upload/assets/launcher_z8.webp.b64'
      - 'nikon-auto-upload/assets/z8_camera.webp.b64'
      - '.github/workflows/build-camera-auto-upload-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build matching app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python camera-auto-upload-windows/make_icon.py

      # 1.0.8+: source is already prepared (prepare_build.py and patch_windows_105-107 are
      # applied and committed). Running them again would fail or double-apply.
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content camera-auto-upload-windows/CameraAutoUpload.Windows.csproj
          $v = $proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Windows $v"

      - name: Build curated official camera photo library
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          python camera-auto-upload-windows/build_camera_assets.py
          $required = @(
            'camera-auto-upload-windows\CameraAssets\Nikon_Z8.png',
            'camera-auto-upload-windows\CameraAssets\Sony_α7_III.png',
            'camera-auto-upload-windows\CameraAssets\Sony_α9_III.png'
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Required professional camera image was not built: $f" }
          }

      - name: Restore
        run: dotnet restore camera-auto-upload-windows/CameraAutoUpload.Windows.csproj

      - name: Publish self-contained Windows app
        run: dotnet publish camera-auto-upload-windows/CameraAutoUpload.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Smoke test app startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\CameraAutoUpload.Windows.exe'
          $p = Start-Process -FilePath $exe -PassThru
          $visible = $false
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { break }
            if ($p.MainWindowHandle -ne 0 -or -not [string]::IsNullOrWhiteSpace($p.MainWindowTitle)) { $visible = $true; break }
          }
          if ($p.HasExited) {
            Write-Host "App exited during startup with code $($p.ExitCode)"
            $log = Join-Path $env:LOCALAPPDATA 'CameraAutoUpload\Logs\startup-crash.log'
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          if (-not $visible) {
            Write-Host 'App stayed alive but did not expose a visible top-level window.'
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Host "Visible window detected: $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

      - name: Build portable package
        shell: pwsh
        run: |
          Copy-Item publish/CameraAutoUpload.Windows.exe CameraAutoUpload-Windows-${{ steps.ver.outputs.version }}.exe
          Compress-Archive -Path publish/* -DestinationPath CameraAutoUpload-Windows-${{ steps.ver.outputs.version }}-portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build real Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "camera-auto-upload-windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CameraAutoUpload-Windows-Setup-${{ steps.ver.outputs.version }}
          path: |
            camera-auto-upload-windows/installer-output/CameraAutoUpload-Windows-Setup-${{ steps.ver.outputs.version }}.exe
            CameraAutoUpload-Windows-${{ steps.ver.outputs.version }}.exe
            CameraAutoUpload-Windows-${{ steps.ver.outputs.version }}-portable.zip
          if-no-files-found: error
