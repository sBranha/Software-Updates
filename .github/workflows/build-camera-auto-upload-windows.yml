name: Build Camera Auto Upload Windows

on:
  workflow_dispatch:
  push:
    branches: [ nikon-auto-upload-build ]
    paths:
      - 'camera-auto-upload-windows/**'
      - '.github/workflows/build-camera-auto-upload-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Windows source
        run: python camera-auto-upload-windows/prepare_build.py

      - name: Restore
        run: dotnet restore camera-auto-upload-windows/CameraAutoUpload.Windows.csproj

      - name: Publish self-contained Windows app
        run: dotnet publish camera-auto-upload-windows/CameraAutoUpload.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Build portable package
        shell: pwsh
        run: |
          Copy-Item publish/CameraAutoUpload.Windows.exe CameraAutoUpload-Windows-1.0.1.exe
          Compress-Archive -Path publish/* -DestinationPath CameraAutoUpload-Windows-1.0.1-portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build real Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "camera-auto-upload-windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CameraAutoUpload-Windows-Setup-1.0.1
          path: |
            camera-auto-upload-windows/installer-output/CameraAutoUpload-Windows-Setup-1.0.1.exe
            CameraAutoUpload-Windows-1.0.1.exe
            CameraAutoUpload-Windows-1.0.1-portable.zip
          if-no-files-found: error
