name: Build Camera Auto Upload Windows

on:
  workflow_dispatch:
  push:
    branches: [ nikon-auto-upload-build ]
    paths:
      - 'camera-auto-upload-windows/**'
      - 'nikon-auto-upload/assets/launcher_z8.webp.b64'
      - '.github/workflows/build-camera-auto-upload-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build matching app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python camera-auto-upload-windows/make_icon.py

      - name: Prepare Windows source
        run: python camera-auto-upload-windows/prepare_build.py

      - name: Apply Windows desktop UI
        run: python camera-auto-upload-windows/run_patch_windows_105.py

      - name: Apply Windows 1.0.6 real-camera-photo UI
        run: python camera-auto-upload-windows/patch_windows_106.py

      - name: Restore
        run: dotnet restore camera-auto-upload-windows/CameraAutoUpload.Windows.csproj

      - name: Publish self-contained Windows app
        run: dotnet publish camera-auto-upload-windows/CameraAutoUpload.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Smoke test app startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\CameraAutoUpload.Windows.exe'
          $p = Start-Process -FilePath $exe -PassThru
          $visible = $false
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { break }
            if ($p.MainWindowHandle -ne 0 -or -not [string]::IsNullOrWhiteSpace($p.MainWindowTitle)) { $visible = $true; break }
          }
          if ($p.HasExited) {
            Write-Host "App exited during startup with code $($p.ExitCode)"
            $log = Join-Path $env:LOCALAPPDATA 'CameraAutoUpload\Logs\startup-crash.log'
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          if (-not $visible) {
            Write-Host 'App stayed alive but did not expose a visible top-level window.'
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Host "Visible window detected: $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

      - name: Build portable package
        shell: pwsh
        run: |
          Copy-Item publish/CameraAutoUpload.Windows.exe CameraAutoUpload-Windows-1.0.6.exe
          Compress-Archive -Path publish/* -DestinationPath CameraAutoUpload-Windows-1.0.6-portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build real Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "camera-auto-upload-windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CameraAutoUpload-Windows-Setup-1.0.6
          path: |
            camera-auto-upload-windows/installer-output/CameraAutoUpload-Windows-Setup-1.0.6.exe
            CameraAutoUpload-Windows-1.0.6.exe
            CameraAutoUpload-Windows-1.0.6-portable.zip
          if-no-files-found: error
