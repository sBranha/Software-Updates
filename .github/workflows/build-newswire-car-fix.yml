name: NewsWire 0.6.3 Android Auto weather map and warning build
on:
  push:
    branches: [newswire-radio-favorites-v0.6.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package radar resources
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 45 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' --output newswave-android/app/src/main/assets/leaflet.js
          curl --fail --location --silent --show-error --retry 3 --max-time 45 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' --output newswave-android/app/src/main/assets/leaflet.css
          python newswave-android/build_radar_stations.py
      - name: Regression checks (template and version)
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.newswire.live'" newswave-android/app/build.gradle
          grep -q 'versionCode 27' newswave-android/app/build.gradle
          grep -q "versionName '0.6.3'" newswave-android/app/build.gradle
          grep -q 'targetSdk 36' newswave-android/app/build.gradle
          grep -q 'setContentTemplate(pane)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          ! grep -q 'PaneTemplate panel=' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q '<category android:name="androidx.car.app.category.WEATHER"/>' newswave-android/app/src/main/AndroidManifest.xml
      - name: Verify installed version label is dynamically populated
        run: |
          grep -Fq 'getPackageManager().getPackageInfo(getPackageName(),0)' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -Fq '"NewsWire v"+installedVersion()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          ! grep -Fq '"NewsWire v0.4.5' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
      - name: Verify car map controls and warning renderer
        run: |
          set -euo pipefail
          grep -q 'setMapController(mapControls)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'void zoomIn()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'void recenter()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'WeatherWarningOverlay.draw' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'api.weather.gov/alerts/active' newswave-android/app/src/main/java/com/newswave/live/WeatherWarningOverlay.java
          grep -q 'versionCode 27' newswave-android/app/build.gradle
      - name: Verify minimal weather map and map style selectors
        run: |
          set -euo pipefail
          grep -Fq 'setTitle("Map").build()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          ! grep -Fq 'setTitle("NewsWire Radar")' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'class MapStyleScreen' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'World_Topo_Map' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'World_Imagery' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'styleSatellite' newswave-android/app/src/main/assets/radar.html
          grep -q 'styleTerrain' newswave-android/app/src/main/assets/radar.html
          grep -q 'styleRoad' newswave-android/app/src/main/assets/radar.html
      - name: Validate embedded radar JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('newswave-android/app/src/main/assets/radar.html').read_text()
          scripts=html.split('<script>')[-1].split('</script>')[:1]
          assert scripts and scripts[-1].strip(), 'embedded script missing'
          Path('/tmp/newswire_radar.js').write_text(scripts[-1])
          PY
          node --check /tmp/newswire_radar.js
      - name: NewsWire update, news and car zoom regression checks
        run: |
          set -euo pipefail
          grep -q 'void focusStation(Station s)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'private void previewZoom()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'scaleAccum\*=factor' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'Executors.newFixedThreadPool(6)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'AppUpdateManagerFactory' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'NewsMonitorWorker.schedule' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'android.permission.POST_NOTIFICATIONS' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.play:app-update' newswave-android/app/build.gradle
          grep -q 'androidx.work:work-runtime' newswave-android/app/build.gradle
      - name: First pair feature regression checks
        run: |
          set -euo pipefail
          grep -q 'class MyAreaData' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'alerts/active?point=' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'observationStations' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'startDashboardGps()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'renderMyArea()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'trackStorms' newswave-android/app/src/main/assets/radar.html
          grep -q 'nearWarnings' newswave-android/app/src/main/assets/radar.html
          grep -q 'versionCode 27' newswave-android/app/build.gradle
      - name: Storm Ahead Alerts safety regression checks
        run: |
          set -euo pipefail
          grep -q 'android:foregroundServiceType="location"' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'private void inspect(Location fix)' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'alerts/active?point=' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'if(fix.hasBearing()&&fix.hasSpeed()' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'NWS check unavailable' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'requestDriveAlerts()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'warningsAvailable' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'START_NOT_STICKY' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'versionCode 27' newswave-android/app/build.gradle
      - name: Verify breaking news + football pair
        run: |
          set -euo pipefail
          grep -q 'topicHeadlines' newswave-android/app/src/main/java/com/newswave/live/LocalNewspapers.java
          grep -q 'publishedMillis' newswave-android/app/src/main/java/com/newswave/live/LocalNewspapers.java
          grep -q 'MAX_STORY_AGE' newswave-android/app/src/main/java/com/newswave/live/NewsMonitorWorker.java
          grep -q 'topic_breaking' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java || grep -q 'topic_"+topic' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'class FootballBoardActivity' newswave-android/app/src/main/java/com/newswave/live/FootballBoardActivity.java
          grep -Fq 'userWidgetId=2070' newswave-android/app/src/main/java/com/newswave/live/FootballBoardActivity.java
          grep -Fq 'FootballBoardActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Drive and traffic source regression checks
        run: |
          set -euo pipefail
          grep -q 'class NewsWireDriveActivity' newswave-android/app/src/main/java/com/newswave/live/NewsWireDriveActivity.java
          grep -q 'TextToSpeech' newswave-android/app/src/main/java/com/newswave/live/NewsWireDriveActivity.java
          grep -q 'MyAreaData.load' newswave-android/app/src/main/java/com/newswave/live/NewsWireDriveActivity.java
          grep -q 'runOnUiThread' newswave-android/app/src/main/java/com/newswave/live/NewsWireDriveActivity.java
          grep -q 'class TrafficActivity' newswave-android/app/src/main/java/com/newswave/live/TrafficActivity.java
          grep -q 'TrafficSources.forState' newswave-android/app/src/main/java/com/newswave/live/TrafficActivity.java
          grep -q 'algotraffic.com' newswave-android/app/src/main/java/com/newswave/live/TrafficSources.java
          grep -q 'fl511.com' newswave-android/app/src/main/java/com/newswave/live/TrafficSources.java
          grep -q '511ga.org' newswave-android/app/src/main/java/com/newswave/live/TrafficSources.java
          grep -q 'smartway.tn.gov' newswave-android/app/src/main/java/com/newswave/live/TrafficSources.java
          grep -q 'mdottraffic.com' newswave-android/app/src/main/java/com/newswave/live/TrafficSources.java
          grep -q 'openTraffic()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'openDrive()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'TrafficActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'NewsWireDriveActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Final pair personalized news and morning briefing checks
        run: |
          set -euo pipefail
          grep -q 'class NewsPreferences' newswave-android/app/src/main/java/com/newswave/live/NewsPreferences.java
          grep -q 'saved_articles' newswave-android/app/src/main/java/com/newswave/live/NewsPreferences.java
          grep -q 'class PersonalizedNewsActivity' newswave-android/app/src/main/java/com/newswave/live/PersonalizedNewsActivity.java
          grep -q 'NewsPreferences.allow' newswave-android/app/src/main/java/com/newswave/live/PersonalizedNewsActivity.java
          grep -q 'class MorningBriefingWorker' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingWorker.java
          grep -q 'ExistingPeriodicWorkPolicy.UPDATE' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingWorker.java
          grep -q 'class MorningBriefingActivity' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -q 'data.warningsAvailable' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingWorker.java
          grep -q 'MorningBriefingWorker.configure' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'openPersonalized()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'MorningBriefingActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'PersonalizedNewsActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Good Morning refresh regression check
        run: |
          set -euo pipefail
          grep -q 'REFRESHING' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -q 'Last checked' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -q 'refreshStartedAt' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -q 'Refresh unavailable or no area set' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -q 'newSnapshot.warningsAvailable' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Four new daily dashboard features regression checks
        run: |
          set -euo pipefail
          grep -q 'class DayPlannerData' newswave-android/app/src/main/java/com/newswave/live/DayPlannerData.java
          grep -q 'forecastHourly' newswave-android/app/src/main/java/com/newswave/live/DayPlannerData.java
          grep -q 'result.size()<12' newswave-android/app/src/main/java/com/newswave/live/DayPlannerData.java
          grep -q 'probabilityOfPrecipitation' newswave-android/app/src/main/java/com/newswave/live/DayPlannerData.java
          grep -q 'class DayPlannerActivity' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'schoolnotification.alsde.edu' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'alabama.travel/events/' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'LocalNewspapers.topicHeadlines(city,region,"events")' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'TrafficSources.forState' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'this::refresh' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'openDay("schools")' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'DayPlannerActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Verify Live Center, radio, stations and widgets
        run: |
          set -euo pipefail
          grep -q 'class ActiveAlertData' newswave-android/app/src/main/java/com/newswave/live/ActiveAlertData.java
          grep -q 'alerts/active?area=' newswave-android/app/src/main/java/com/newswave/live/ActiveAlertData.java
          grep -q 'geometry' newswave-android/app/src/main/java/com/newswave/live/ActiveAlertData.java
          grep -q 'showWarnings' newswave-android/app/src/main/assets/live_center_map.html
          grep -q 'World_Imagery' newswave-android/app/src/main/assets/live_center_map.html
          grep -q 'class LiveCenterActivity' newswave-android/app/src/main/java/com/newswave/live/LiveCenterActivity.java
          grep -q 'class NewsRadioActivity' newswave-android/app/src/main/java/com/newswave/live/NewsRadioActivity.java
          grep -q 'TextToSpeech' newswave-android/app/src/main/java/com/newswave/live/NewsRadioActivity.java
          grep -q 'class StationFinderActivity' newswave-android/app/src/main/java/com/newswave/live/StationFinderActivity.java
          grep -q 'publicfiles.fcc.gov' newswave-android/app/src/main/java/com/newswave/live/StationFinderActivity.java
          grep -q 'class NewsWireWidget' newswave-android/app/src/main/java/com/newswave/live/NewsWireWidget.java
          grep -q 'class WidgetRefreshWorker' newswave-android/app/src/main/java/com/newswave/live/WidgetRefreshWorker.java
          grep -q 'newswire_widget' newswave-android/app/src/main/res/xml/newswire_widget_info.xml
          grep -q 'NewsWireWidget' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'LiveCenterActivity' newswave-android/app/src/main/AndroidManifest.xml
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Validate Live Center Map JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('newswave-android/app/src/main/assets/live_center_map.html')
          s=p.read_text()
          Path('/tmp/newswire_live_center.js').write_text(s.split('<script>')[-1].split('</script>')[0])
          PY
          node --check /tmp/newswire_live_center.js
      - name: Verify expanded school sports reporting
        run: |
          set -euo pipefail
          grep -q 'case "basketball"' newswave-android/app/src/main/java/com/newswave/live/LocalNewspapers.java
          grep -q 'case "baseball"' newswave-android/app/src/main/java/com/newswave/live/LocalNewspapers.java
          grep -q 'case "soccer"' newswave-android/app/src/main/java/com/newswave/live/LocalNewspapers.java
          grep -q 'chosenSport' newswave-android/app/src/main/java/com/newswave/live/FootballBoardActivity.java
          grep -q 'Publisher feed checked' newswave-android/app/src/main/java/com/newswave/live/FootballBoardActivity.java
      - name: Reliability and location regression checks
        run: |
          set -euo pipefail
          grep -q 'startMap(query.has' newswave-android/app/src/main/assets/live_center_map.html
          grep -q 'function mapError' newswave-android/app/src/main/assets/live_center_map.html
          grep -q 'map.removeLayer(alertLayer)' newswave-android/app/src/main/assets/live_center_map.html
          grep -q 'private void followLocation()' newswave-android/app/src/main/java/com/newswave/live/LiveCenterActivity.java
          grep -q 'updates.postDelayed(periodicCheck' newswave-android/app/src/main/java/com/newswave/live/LiveCenterActivity.java
          grep -q 'for(int i=0;i<features.length();i++)' newswave-android/app/src/main/java/com/newswave/live/ActiveAlertData.java
          grep -q 'subList(200' newswave-android/app/src/main/java/com/newswave/live/ActiveAlertData.java
          grep -q 'Test' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'refreshStartedAt' newswave-android/app/src/main/java/com/newswave/live/DayPlannerActivity.java
          grep -q 'newSnapshot.warningsAvailable' newswave-android/app/src/main/java/com/newswave/live/MorningBriefingActivity.java
          grep -q '4_000_000L' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Assert v0.6.3 warning and map reliability safeguards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          alerts=Path('newswave-android/app/src/main/java/com/newswave/live/ActiveAlertData.java').read_text()
          live=Path('newswave-android/app/src/main/java/com/newswave/live/LiveCenterActivity.java').read_text()
          html=Path('newswave-android/app/src/main/assets/live_center_map.html').read_text()
          assert alerts.index('if(Double.isFinite(lat)') < alerts.index('else if(!code.isEmpty())'), 'point warning priority regressed'
          assert 'warnings=null; // Never present stale warnings' in live, 'failed refresh could show stale warnings'
          assert '30000L' in live, 'NWS refresh stall timeout missing'
          assert 'lastLocationAlertCheck' in live and 'updateAlerts();' in live, 'travel warnings may not refresh'
          assert 'function recenter()' in html and 'followEnabled=false' in html, 'map recenter or manual pan missing'
          assert 'map.setView([lat,lon],map.getZoom()' in html, 'GPS update resets zoom'
          print('NewsWire reliability regression assertions passed')
          PY
      - name: Check expanded Storm Ahead warning coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java').read_text()
          for event in ('Tornado Warning', 'Severe Thunderstorm Warning', 'Flash Flood Warning'):
              assert event in s, event + ' missing from Storm Ahead'
          assert 'severeWarnings(fix)' in s and 'severeWarnings(point)' in s
          assert 'future.removeAll(current)' in s
          assert 'This is not a route or arrival-time prediction' in s
          assert 'private void inspect(Location fix)' in s
          print('Storm Ahead coverage assertions passed')
          PY
      - name: Smart Storm Tracking geometry and UI regression tests
        run: |
          node --check newswave-android/app/src/main/assets/storm_tracking.js
          node newswave-android/tests/storm_tracking.test.js
      - name: Test Play updater states and backward compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('newswave-android/app/src/main/java/com/newswave/live/MainActivity.java').read_text()
          for expected in ('AppUpdateType.FLEXIBLE', 'AppUpdateType.IMMEDIATE',
                           'InstallStatus.DOWNLOADED', 'completeUpdate()',
                           'registerListener(playUpdateListener)',
                           'unregisterListener(playUpdateListener)',
                           'DEVELOPER_TRIGGERED_UPDATE_IN_PROGRESS',
                           'openNewsWirePlayListing()', 'renderUpdateAction()'):
              assert expected in s, expected+' was removed'
          assert "You're on the latest Google Play version of NewsWire." not in s
          assert 'AppUpdateOptions.newBuilder(type).build()' in s
          print('NewsWire Play updater regression guards passed')
          PY
      - name: Check car safety dashboard and live map controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          car=Path('newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java').read_text()
          m=Path('newswave-android/app/src/main/assets/live_center_map.html').read_text()
          assert 'class SafetyDashboardScreen' in car
          assert 'ActiveAlertData.load(' in car
          assert 'Warning status: UNKNOWN' in car
          assert 'lastFix=new Location(loc)' in car
          assert 'function setMapStyle(style)' in m
          assert 'mapStyle=' in m and 'alertLayer=L.geoJSON' in m
          print('Car dashboard and live map controls verified')
          PY
          node - <<'JS'
          const s=require('fs').readFileSync('newswave-android/app/src/main/assets/live_center_map.html','utf8');
          const a=s.lastIndexOf('<script>'),b=s.lastIndexOf('</script>');
          new Function(s.slice(a+8,b));
          console.log('Live map JavaScript syntax passed');
          JS
      - name: Home screen widget sizing, placement and startup regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          prefix='newswave-android/app/src/main/'
          android='{http://schemas.android.com/apk/res/android}'
          spec=ET.parse(prefix+'res/xml/newswire_widget_info.xml').getroot()
          assert spec.get(android+'targetCellWidth')=='2'
          assert spec.get(android+'targetCellHeight')=='2'
          assert spec.get(android+'minWidth')=='120dp'
          assert spec.get(android+'minHeight')=='105dp'
          for item in ('initialLayout','resizeMode','widgetCategory'):
              assert spec.get(android+item)
          layout=ET.parse(prefix+'res/layout/newswire_widget.xml').getroot()
          ids={x.get(android+'id') for x in layout.iter()}
          for name in ('widget_root','widget_header','widget_location','widget_weather','widget_alert','widget_headline','widget_checked','widget_refresh'):
              assert '@+id/'+name in ids, name
          provider=Path(prefix+'java/com/newswave/live/NewsWireWidget.java').read_text()
          launcher=Path(prefix+'java/com/newswave/live/MainActivity.java').read_text()
          assert 'safeRender(context)' in provider
