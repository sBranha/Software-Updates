name: NewsWire 0.5.1 Android Auto weather map and warning build
on:
  push:
    branches: [newswire-storm-myarea-v0.5.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package radar resources
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 45 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' --output newswave-android/app/src/main/assets/leaflet.js
          curl --fail --location --silent --show-error --retry 3 --max-time 45 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' --output newswave-android/app/src/main/assets/leaflet.css
          python newswave-android/build_radar_stations.py
      - name: Regression checks (template and version)
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.newswire.live'" newswave-android/app/build.gradle
          grep -q 'versionCode 15' newswave-android/app/build.gradle
          grep -q "versionName '0.5.1'" newswave-android/app/build.gradle
          grep -q 'targetSdk 36' newswave-android/app/build.gradle
          grep -q 'setContentTemplate(pane)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          ! grep -q 'PaneTemplate panel=' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q '<category android:name="androidx.car.app.category.WEATHER"/>' newswave-android/app/src/main/AndroidManifest.xml
      - name: Verify installed version label is dynamically populated
        run: |
          grep -Fq 'getPackageManager().getPackageInfo(getPackageName(),0)' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -Fq '"NewsWire v"+installedVersion()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          ! grep -Fq '"NewsWire v0.4.5' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
      - name: Verify car map controls and warning renderer
        run: |
          set -euo pipefail
          grep -q 'setMapController(mapControls)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'void zoomIn()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'void recenter()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'WeatherWarningOverlay.draw' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'api.weather.gov/alerts/active' newswave-android/app/src/main/java/com/newswave/live/WeatherWarningOverlay.java
          grep -q 'versionCode 15' newswave-android/app/build.gradle
      - name: Verify minimal weather map and map style selectors
        run: |
          set -euo pipefail
          grep -Fq 'setTitle("Map").build()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          ! grep -Fq 'setTitle("NewsWire Radar")' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'class MapStyleScreen' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'World_Topo_Map' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'World_Imagery' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'styleSatellite' newswave-android/app/src/main/assets/radar.html
          grep -q 'styleTerrain' newswave-android/app/src/main/assets/radar.html
          grep -q 'styleRoad' newswave-android/app/src/main/assets/radar.html
      - name: Validate embedded radar JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('newswave-android/app/src/main/assets/radar.html').read_text()
          scripts=html.split('<script>')[-1].split('</script>')[:1]
          assert scripts and scripts[-1].strip(), 'embedded script missing'
          Path('/tmp/newswire_radar.js').write_text(scripts[-1])
          PY
          node --check /tmp/newswire_radar.js
      - name: NewsWire update, news and car zoom regression checks
        run: |
          set -euo pipefail
          grep -q 'void focusStation(Station s)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'private void previewZoom()' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'scaleAccum\*=factor' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'Executors.newFixedThreadPool(6)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q 'AppUpdateManagerFactory' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'NewsMonitorWorker.schedule' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'android.permission.POST_NOTIFICATIONS' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.play:app-update' newswave-android/app/build.gradle
          grep -q 'androidx.work:work-runtime' newswave-android/app/build.gradle
      - name: First pair feature regression checks
        run: |
          set -euo pipefail
          grep -q 'class MyAreaData' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'alerts/active?point=' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'observationStations' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'startDashboardGps()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'renderMyArea()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'trackStorms' newswave-android/app/src/main/assets/radar.html
          grep -q 'nearWarnings' newswave-android/app/src/main/assets/radar.html
          grep -q 'versionCode 15' newswave-android/app/build.gradle
      - name: Storm Ahead Alerts safety regression checks
        run: |
          set -euo pipefail
          grep -q 'android:foregroundServiceType="location"' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' newswave-android/app/src/main/AndroidManifest.xml
          grep -q 'private void inspect(Location fix)' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'alerts/active?point=' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'if(fix.hasBearing()&&fix.hasSpeed()' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'NWS check unavailable' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'requestDriveAlerts()' newswave-android/app/src/main/java/com/newswave/live/MainActivity.java
          grep -q 'warningsAvailable' newswave-android/app/src/main/java/com/newswave/live/MyAreaData.java
          grep -q 'START_NOT_STICKY' newswave-android/app/src/main/java/com/newswave/live/DriveWarningService.java
          grep -q 'versionCode 15' newswave-android/app/build.gradle
      - name: Compile release app bundle
        run: gradle -p newswave-android :app:bundleRelease --no-daemon
      - name: Check output bundle archive
        run: |
          cp newswave-android/app/build/outputs/bundle/release/app-release.aab NewsWire-v0.5.1-UNSIGNED.aab
          unzip -t NewsWire-v0.5.1-UNSIGNED.aab >/dev/null
          sha256sum NewsWire-v0.5.1-UNSIGNED.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.5.1-unsigned-intermediate
          path: |
            NewsWire-v0.5.1-UNSIGNED.aab
            SHA256SUMS.txt
          retention-days: 15
