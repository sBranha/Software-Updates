name: NewsWire 0.4.6 Android Auto crash fix (compile and package)
on:
  push:
    branches: [newswire-auto-fix-v0.4.6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package radar resources
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 45 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' --output newswave-android/app/src/main/assets/leaflet.js
          curl --fail --location --silent --show-error --retry 3 --max-time 45 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' --output newswave-android/app/src/main/assets/leaflet.css
          python newswave-android/build_radar_stations.py
      - name: Regression checks (template and version)
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.newswire.live'" newswave-android/app/build.gradle
          grep -q 'versionCode 10' newswave-android/app/build.gradle
          grep -q "versionName '0.4.6'" newswave-android/app/build.gradle
          grep -q 'targetSdk 36' newswave-android/app/build.gradle
          grep -q 'setContentTemplate(list)' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          ! grep -q 'PaneTemplate panel=' newswave-android/app/src/main/java/com/newswave/live/NewsWaveCarService.java
          grep -q '<category android:name="androidx.car.app.category.WEATHER"/>' newswave-android/app/src/main/AndroidManifest.xml
      - name: Compile release app bundle
        run: gradle -p newswave-android :app:bundleRelease --no-daemon
      - name: Check output bundle archive
        run: |
          cp newswave-android/app/build/outputs/bundle/release/app-release.aab NewsWire-v0.4.6-UNSIGNED.aab
          unzip -t NewsWire-v0.4.6-UNSIGNED.aab >/dev/null
          sha256sum NewsWire-v0.4.6-UNSIGNED.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.4.6-unsigned-intermediate
          path: |
            NewsWire-v0.4.6-UNSIGNED.aab
            SHA256SUMS.txt
          retention-days: 15
