      - name: QA package must not overwrite installed Google Play NewsWire
        run: |
          set -euo pipefail
          grep -Fq "applicationIdSuffix '.test'" newswave-android/app/build.gradle
          grep -Fq 'android:label="NewsWire TEST"' newswave-android/app/src/debug/AndroidManifest.xml
          grep -Fq 'versionCode 27' newswave-android/app/build.gradle
      - name: Compile installable debug APK and unsigned release bundle
        run: gradle -p newswave-android :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Verify package archives and checksums
        run: |
          set -euo pipefail
          cp newswave-android/app/build/outputs/apk/debug/app-debug.apk NewsWire-v0.6.3-TEST.apk
          cp newswave-android/app/build/outputs/bundle/release/app-release.aab NewsWire-v0.6.3-UNSIGNED.aab
          test -s NewsWire-v0.6.3-TEST.apk
          test -s NewsWire-v0.6.3-UNSIGNED.aab
          unzip -t NewsWire-v0.6.3-TEST.apk >/dev/null
          unzip -t NewsWire-v0.6.3-UNSIGNED.aab >/dev/null
          sha256sum NewsWire-v0.6.3-TEST.apk NewsWire-v0.6.3-UNSIGNED.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWire-v0.6.3-test-APK-and-unsigned-AAB
          path: |
            NewsWire-v0.6.3-TEST.apk
            NewsWire-v0.6.3-UNSIGNED.aab
            SHA256SUMS.txt
          retention-days: 15

      - name: Retrieve original public encrypted signing backup for offline certificate recovery
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            "https://github.com/sBranha/Software-Updates/releases/download/newswire-play-internal-v0.4.5/NewsWire-Upload-Key-Backup-ENCRYPTED.p7m" \
            --output NewsWire-Upload-Key-Backup-ENCRYPTED.p7m
          test "$(wc -c < NewsWire-Upload-Key-Backup-ENCRYPTED.p7m)" -gt 2000
      - uses: actions/upload-artifact@v4
        with:
          name: NewsWire-original-PUBLIC-encrypted-upload-backup
          path: NewsWire-Upload-Key-Backup-ENCRYPTED.p7m
          retention-days: 1
