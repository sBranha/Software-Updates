name: Build Speak Spanish v1.0.1 APK

on:
  push:
    branches:
      - speak-spanish-v1.0.1-fix
    paths:
      - 'speak-spanish-android-1.0.1/**'
      - '.github/workflows/build-speak-spanish-v1.0.1.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p speak-spanish-android-1.0.1 :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp speak-spanish-android-1.0.1/app/build/outputs/apk/debug/app-debug.apk Speak-Spanish-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Speak-Spanish-v1.0.1-APK
          path: Speak-Spanish-v1.0.1.apk
          if-no-files-found: error
