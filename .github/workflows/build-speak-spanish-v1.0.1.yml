name: Build Speak Spanish v1.0.1 APK

on:
  push:
    branches:
      - speak-spanish-v1.0.1-fix
    paths:
      - 'speak-spanish-android-1.0.1/**'
      - '.github/workflows/build-speak-spanish-v1.0.1.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p speak-spanish-android-1.0.1 :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp speak-spanish-android-1.0.1/app/build/outputs/apk/debug/app-debug.apk Speak-Spanish-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Speak-Spanish-v1.0.1-APK
          path: Speak-Spanish-v1.0.1.apk
          if-no-files-found: error
