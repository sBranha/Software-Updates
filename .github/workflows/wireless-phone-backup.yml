name: Wireless Phone Backup installers
on:
  push:
    branches: [wireless-phone-backup-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone Windows application
        run: |
          python -m pip install --upgrade pyinstaller cryptography
          pyinstaller --onefile --windowed --name WirelessPhoneBackup backup/windows/backup.py
      - name: Package Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "backup/windows/installer.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessPhoneBackup-Windows-Installer
          path: dist/WirelessPhoneBackup-Setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable debug APK
        run: gradle -p backup/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessPhoneBackup-Android-APK
          path: backup/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
