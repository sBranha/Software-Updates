name: Publish NewsWire v0.7.13 signed Google Play AAB
on:
  push:
    branches: [newswire-direct-release-v0.7.13]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reassemble and verify signed Google Play bundle
        shell: bash
        run: |
          set -euo pipefail
          cat newswire-downloads/v0.7.13/part-*.b64 | base64 --decode > NewsWire-v0.7.13-backup.zip
          printf '%s  %s\n' '32d04ad67688349ae9294dc4046611a152b0ad6b1b9029163277ec43d42c7c32' 'NewsWire-v0.7.13-backup.zip' | sha256sum -c -
          unzip -p NewsWire-v0.7.13-backup.zip NewsWire-v0.7.13-Google-Play-SIGNED.aab > NewsWire-v0.7.13-Google-Play-SIGNED.aab
          printf '%s  %s\n' '7d8565d17c380d014a67f9fc7556a9692a3ed864e7702954a1c626c729e00548' 'NewsWire-v0.7.13-Google-Play-SIGNED.aab' | sha256sum -c -
          unzip -t NewsWire-v0.7.13-Google-Play-SIGNED.aab >/dev/null
          jarsigner -verify NewsWire-v0.7.13-Google-Play-SIGNED.aab | grep 'jar verified.'
          keytool -printcert -jarfile NewsWire-v0.7.13-Google-Play-SIGNED.aab | grep -F 'SHA256: 2A:51:33:B7:F0:9A:1E:27:38:56:F1:C7:B5:72:37:42:B8:2E:0D:4F:7D:E2:FF:24:93:2E:C5:3C:82:76:48:3E'
          test "$(stat -c %s NewsWire-v0.7.13-Google-Play-SIGNED.aab)" -eq 3940401
      - name: Publish one-click signed Google Play AAB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='newswire-android-v0.7.13-download'
          asset='NewsWire-v0.7.13-Google-Play-SIGNED.aab'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title 'NewsWire Android v0.7.13 - Signed Google Play AAB' --notes 'NewsWire v0.7.13 (versionCode 48), close-up zoom level 17 on Android Auto with default heading-up 3D view and recenter. Same original upload certificate as previous Play releases. Direct AAB for Google Play Console.'
          fi
